    <!-- Interactive JavaScript Logic -->
    <script>
        // --- OPTIONAL GENTLE SOUND CHIMES (Tone.js) ---
        let soundEnabled = false;
        let synth = null;

        function toggleSound() {
            soundEnabled = !soundEnabled;
            const icon = document.getElementById('sound-icon');
            const label = document.getElementById('sound-label');

            if (soundEnabled) {
                if (!synth && typeof Tone !== 'undefined') {
                    Tone.start();
                    synth = new Tone.PolySynth(Tone.Synth, {
                        oscillator: { type: "sine" },
                        envelope: { attack: 0.08, decay: 0.3, sustain: 0.1, release: 1.2 },
                        volume: -16
                    }).toDestination();
                }
                icon.className = 'fa-solid fa-volume-high';
                label.textContent = 'Chimes On';
                playChime('C5');
            } else {
                icon.className = 'fa-solid fa-volume-xmark';
                label.textContent = 'Chimes Off';
            }
        }

        function playChime(note = 'E5') {
            if (soundEnabled && synth) {
                try {
                    synth.triggerAttackRelease(note, "8n");
                } catch (e) {
                    // Fail silently if audio context blocked
                }
            }
        }

        // --- 1. MOOD CHECK-IN DATA & INTERACTION ---
        const moodData = {
            chill: {
                badge: '🌿 Chill Vibe',
                badgeClass: 'bg-sage-200 text-sage-700',
                title: 'Protect that peaceful momentum!',
                tip: 'You’re in a great headspace right now. Enjoy the calm without feeling pressured to optimize every single second of it.',
                action: 'Step outside for 2 minutes of fresh air',
                music: 'Acoustic Morning & Warm Vinyl',
                note: 'G5'
            },
            stressed: {
                badge: '😬 Stressed Vibe',
                badgeClass: 'bg-peach-100 text-peach-500',
                title: 'Too many browser tabs open in your brain?',
                tip: 'When everything feels urgent, nothing actually is. Pick just ONE tiny thing to finish, and give yourself permission to pause the rest for 10 minutes.',
                action: 'Unclench your jaw & drink a glass of water',
                music: 'Soft Piano & Distant Raindrops',
                note: 'E5'
            },
            overwhelmed: {
                badge: '🌀 Overwhelmed Vibe',
                badgeClass: 'bg-lavender-100 text-lavender-600',
                title: 'Hit pause—your brain is just buffering.',
                tip: 'You don’t have to solve the whole week in the next five minutes. Shrink your focus down to just the very next small step.',
                action: 'Try the 60s Breathing Bubble below',
                music: 'Ambient Space Pads (60 BPM)',
                note: 'D5'
            },
            energized: {
                badge: '⚡ Energized Vibe',
                badgeClass: 'bg-amber-100 text-amber-700',
                title: 'Love that spark! Channel it somewhere fun.',
                tip: 'Ride this wave! Tackle that one task you’ve been putting off, or send a quick voice note to hype up a friend.',
                action: 'Knock out one 5-minute quick win',
                music: 'Upbeat Indie & Sunny Bossa Nova',
                note: 'A5'
            },
            low: {
                badge: '☁️ Low Battery Vibe',
                badgeClass: 'bg-sky-100 text-sky-700',
                title: 'Low-power mode is totally valid today.',
                tip: 'Phones need charging, and humans do too. Treat yourself with the same kindness you’d offer a tired friend—zero guilt required.',
                action: 'Put on cozy socks & lower screen brightness',
                music: 'Warm Cello & Cozy Fireplace',
                note: 'C5'
            }
        };

        function selectMood(moodKey) {
            const data = moodData[moodKey];
            if (!data) return;

            playChime(data.note);

            // Highlight active button
            document.querySelectorAll('.mood-btn').forEach(btn => {
                if (btn.dataset.mood === moodKey) {
                    btn.classList.add('ring-2', 'ring-slate-900', 'scale-[1.03]', 'bg-white');
                } else {
                    btn.classList.remove('ring-2', 'ring-slate-900', 'scale-[1.03]', 'bg-white');
                }
            });

            // Update panel content smoothly
            const badge = document.getElementById('result-badge');
            badge.textContent = data.badge;
            badge.className = `px-3 py-1 rounded-full text-xs font-bold ${data.badgeClass}`;

            document.getElementById('result-title').textContent = data.title;
            document.getElementById('result-tip').textContent = data.tip;
            document.getElementById('result-action').textContent = data.action;
            document.getElementById('result-music').innerHTML = `<i class="fa-solid fa-headphones"></i> <span>${data.music}</span>`;
        }

        // --- 2A. 60-SECOND BREATHING BUBBLE ---
        let breathInterval = null;
        let breathPhaseInterval = null;
        let isBreathing = false;
        let secondsLeft = 60;

        function toggleBreathing() {
            if (isBreathing) {
                stopBreathing();
            } else {
                startBreathing();
            }
        }

        function startBreathing() {
            isBreathing = true;
            secondsLeft = 60;
            const btn = document.getElementById('breath-btn');
            const btnText = document.getElementById('breath-btn-text');
            const btnIcon = document.getElementById('breath-btn-icon');
            const circle = document.getElementById('breathing-circle');
            const instruction = document.getElementById('breath-instruction');
            const timerDisplay = document.getElementById('breath-timer');

            btnText.textContent = 'Stop Exercise';
            btnIcon.className = 'fa-solid fa-stop';
            btn.classList.replace('bg-sage-600', 'bg-slate-800');
            btn.classList.replace('hover:bg-sage-700', 'hover:bg-slate-700');

            let phase = 0; // 0: Inhale (4s), 1: Hold (4s), 2: Exhale (4s)

            function runPhase() {
                if (!isBreathing) return;
                if (phase === 0) {
                    instruction.textContent = 'Inhale...';
                    circle.style.transform = 'scale(1.85)';
                    playChime('C5');
                } else if (phase === 1) {
                    instruction.textContent = 'Hold';
                    circle.style.transform = 'scale(1.85)';
                    playChime('E5');
                } else {
                    instruction.textContent = 'Exhale...';
                    circle.style.transform = 'scale(1)';
                    playChime('G4');
                }
                phase = (phase + 1) % 3;
            }

            runPhase();
            breathPhaseInterval = setInterval(runPhase, 4000);

            breathInterval = setInterval(() => {
                secondsLeft--;
                const mins = String(Math.floor(secondsLeft / 60)).padStart(2, '0');
                const secs = String(secondsLeft % 60).padStart(2, '0');
                timerDisplay.textContent = `${mins}:${secs}`;

                if (secondsLeft <= 0) {
                    stopBreathing(true);
                }
            }, 1000);
        }

        function stopBreathing(completed = false) {
            isBreathing = false;
            clearInterval(breathInterval);
            clearInterval(breathPhaseInterval);

            const btn = document.getElementById('breath-btn');
            const btnText = document.getElementById('breath-btn-text');
            const btnIcon = document.getElementById('breath-btn-icon');
            const circle = document.getElementById('breathing-circle');
            const instruction = document.getElementById('breath-instruction');
            const timerDisplay = document.getElementById('breath-timer');

            circle.style.transform = 'scale(1)';
            instruction.textContent = completed ? 'Nice job! ✨' : 'Ready?';
            timerDisplay.textContent = '01:00';
            btnText.textContent = 'Start 60s Reset';
            btnIcon.className = 'fa-solid fa-play';
            btn.classList.replace('bg-slate-800', 'bg-sage-600');
            btn.classList.replace('hover:bg-slate-700', 'hover:bg-sage-700');

            if (completed) playChime('C6');
        }

        // --- 2B. 5-4-3-2-1 GROUNDING CHECKLIST ---
        function toggleGroundingStep(button) {
            const isDone = button.classList.toggle('done');
            const badge = button.querySelector('.check-badge');

            if (isDone) {
                button.classList.remove('bg-cream/60', 'border-slate-100');
                button.classList.add('bg-sage-100/80', 'border-sage-300', 'opacity-75');
                badge.innerHTML = '<i class="fa-solid fa-check"></i>';
                badge.classList.replace('bg-lavender-100', 'bg-sage-600');
                badge.classList.replace('text-lavender-600', 'text-white');
                playChime('E5');
            } else {
                const index = Array.from(button.parentNode.children).indexOf(button);
                const numbers = ['5', '4', '3', '2', '1'];
                button.classList.add('bg-cream/60', 'border-slate-100');
                button.classList.remove('bg-sage-100/80', 'border-sage-300', 'opacity-75');
                badge.textContent = numbers[index];
                badge.classList.replace('bg-sage-600', 'bg-lavender-100');
                badge.classList.replace('text-white', 'text-lavender-600');
            }

            const totalDone = document.querySelectorAll('.grounding-item.done').length;
            document.getElementById('grounding-progress').textContent = `${totalDone} / 5 Done`;
        }

        function resetGrounding() {
            const numbers = ['5', '4', '3', '2', '1'];
            document.querySelectorAll('.grounding-item').forEach((btn, idx) => {
                btn.classList.remove('done', 'bg-sage-100/80', 'border-sage-300', 'opacity-75');
                btn.classList.add('bg-cream/60', 'border-slate-100');
                const badge = btn.querySelector('.check-badge');
                badge.textContent = numbers[idx];
                badge.classList.remove('bg-sage-600', 'text-white');
                badge.classList.add('bg-lavender-100', 'text-lavender-600');
            });
            document.getElementById('grounding-progress').textContent = '0 / 5 Done';
        }

        // --- 2C. WORRY SHREDDER ---
        let shreddedCount = 0;

        function shredWorry() {
            const input = document.getElementById('worry-input');
            const paper = document.getElementById('worry-paper');
            const feedback = document.getElementById('shred-feedback');

            if (!input.value.trim()) {
                input.placeholder = "Type even a tiny annoyance first, then shred it...";
                input.focus();
                return;
            }

            playChime('G4');
            paper.classList.add('shredding');

            setTimeout(() => {
                input.value = '';
                paper.classList.remove('shredding');
                shreddedCount++;
                document.getElementById('shred-count').textContent = `${shreddedCount} ${shreddedCount === 1 ? 'worry' : 'worries'} shredded`;

                feedback.classList.remove('opacity-0');
                setTimeout(() => {
                    feedback.classList.add('opacity-0');
                }, 2600);
            }, 1300);
        }

        // --- 3. MYTH VS. FACT FLASHCARD DECK ---
        const mythCards = [
            {
                myth: '“Self-care means bubble baths, pricey smoothies, and ignoring your responsibilities.”',
                fact: 'Real self-care is often pretty unglamorous—like drinking a glass of water, setting a gentle boundary, going to bed 30 minutes earlier, or asking a friend for help.'
            },
            {
                myth: '“You should only talk to a counselor or therapist when things hit rock bottom.”',
                fact: 'Think of mental health support like a regular tune-up, not just emergency roadside assistance. Talking things through early builds awesome everyday resilience.'
            },
            {
                myth: '“If someone looks happy and productive on social media, they must be doing totally fine.”',
                fact: 'People can be high-achieving, funny, and social while still carrying quiet stress inside. Checking in on your “strong” friends always means a lot.'
            },
            {
                myth: '“Rest has to be ‘earned’ after you finish every single item on your to-do list.”',
                fact: 'Rest is a basic human baseline, not a reward sticker! Your brain actually solves problems better after genuine downtime.'
            }
        ];

        let currentCardIndex = 0;
        let isFlipped = false;

        function renderCard() {
            const inner = document.getElementById('flashcard-inner');
            isFlipped = false;
            inner.classList.remove('is-flipped');

            setTimeout(() => {
                document.getElementById('myth-text').textContent = mythCards[currentCardIndex].myth;
                document.getElementById('fact-text').textContent = mythCards[currentCardIndex].fact;
                document.getElementById('card-counter').textContent = `${currentCardIndex + 1} / ${mythCards.length}`;
            }, 150);
        }

        function flipCard() {
            const inner = document.getElementById('flashcard-inner');
            isFlipped = !isFlipped;
            inner.classList.toggle('is-flipped', isFlipped);
            playChime(isFlipped ? 'G5' : 'E5');
        }

        function nextCard() {
            currentCardIndex = (currentCardIndex + 1) % mythCards.length;
            renderCard();
            playChime('C5');
        }

        function prevCard() {
            currentCardIndex = (currentCardIndex - 1 + mythCards.length) % mythCards.length;
            renderCard();
            playChime('C5');
        }

        // --- 4. FULL-SCREEN STICKMAN PARTY & ".ME." INTRO CINEMATIC ---
        const introOverlay = document.getElementById('intro-overlay');
        const introCanvas = document.getElementById('intro-canvas');
        const introCtx = introCanvas ? introCanvas.getContext('2d') : null;

        let introAnimId = null;
        let introStartTime = null;
        let introActive = true;
        let introCuePlayed = { act2: false, act3: false, bloom: false };
        const INTRO_DURATION = 12.2; // seconds

        // Ambient isolation particles for Act 1 & 2
        const lonelinessParticles = Array.from({ length: 38 }, (_, i) => ({
            x: (i * 97) % 100,
            y: (i * 53) % 100,
            r: 1.5 + (i % 3),
            speedY: 0.12 + (i % 5) * 0.04,
            drift: (i % 2 === 0 ? 1 : -1) * 0.15
        }));

        function resizeIntroCanvas() {
            if (!introCanvas) return;
            const dpr = Math.min(window.devicePixelRatio || 1, 2);
            introCanvas.width = window.innerWidth * dpr;
            introCanvas.height = window.innerHeight * dpr;
            if (introCtx) {
                introCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
            }
        }

        window.addEventListener('resize', resizeIntroCanvas);

        function enableIntroAudio() {
            if (!soundEnabled) {
                toggleSound();
            } else {
                playChime('E5');
            }
            const icon = document.getElementById('intro-audio-icon');
            const label = document.getElementById('intro-audio-label');
            if (icon) icon.className = 'fa-solid fa-volume-high';
            if (label) label.textContent = 'Story Chimes On';
        }

        function lerp(a, b, t) {
            return a + (b - a) * Math.max(0, Math.min(1, t));
        }

        function lerpColor(c1, c2, t) {
            const clamped = Math.max(0, Math.min(1, t));
            const r = Math.round(c1[0] + (c2[0] - c1[0]) * clamped);
            const g = Math.round(c1[1] + (c2[1] - c1[1]) * clamped);
            const b = Math.round(c1[2] + (c2[2] - c1[2]) * clamped);
            return `rgb(${r}, ${g}, ${b})`;
        }

        function drawScribbleCloud(ctx, x, y, alpha, time) {
            if (alpha <= 0.01) return;
            ctx.save();
            ctx.globalAlpha = alpha;
            ctx.translate(x, y + Math.sin(time * 3) * 3);

            // Dark moody cloud puffs
            ctx.fillStyle = '#334155';
            ctx.strokeStyle = '#0F172A';
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            ctx.arc(-14, 2, 11, 0, Math.PI * 2);
            ctx.arc(0, -4, 14, 0, Math.PI * 2);
            ctx.arc(15, 2, 11, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            // Tangled stress scribble inside cloud
            ctx.strokeStyle = '#94A3B8';
            ctx.lineWidth = 1.6;
            ctx.beginPath();
            for (let a = 0; a < Math.PI * 4; a += 0.35) {
                const rx = Math.cos(a * 1.7 + time * 4) * 11;
                const ry = Math.sin(a * 2.3) * 5;
                if (a === 0) ctx.moveTo(rx, ry);
                else ctx.lineTo(rx, ry);
            }
            ctx.stroke();
            ctx.restore();
        }

        function drawStickmanPartyCharacter(ctx, x, y, opts) {
            const { slump, walkCycle, lookUp, smile, scale = 1 } = opts;
            ctx.save();
            ctx.translate(x, y);
            ctx.scale(scale, scale);

            // Ground contact shadow
            ctx.fillStyle = 'rgba(15, 23, 42, 0.25)';
            ctx.beginPath();
            ctx.ellipse(0, 0, 26, 7, 0, 0, Math.PI * 2);
            ctx.fill();

            // Stickman Party bold rounded style
            const limbColor = '#1E293B';
            const bodyFill = '#FF6B6B'; // Iconic playful Stickman Party coral-red
            const strokeMain = '#0F172A';

            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            // Walking leg angles (slow down as slump increases)
            const stride = Math.sin(walkCycle) * (0.48 * (1 - slump * 0.55));
            const hipY = -44 + slump * 5;

            // Back Leg
            ctx.strokeStyle = strokeMain;
            ctx.lineWidth = 8.5;
            ctx.beginPath();
            ctx.moveTo(-3, hipY);
            const backKneeX = -Math.sin(stride) * 14;
            const backKneeY = hipY + 21;
            const backFootX = -Math.sin(stride) * 22;
            const backFootY = -3 - Math.max(0, -Math.cos(walkCycle)) * 4 * (1 - slump * 0.5);
            ctx.lineTo(backKneeX, backKneeY);
            ctx.lineTo(backFootX, backFootY);
            ctx.stroke();

            // Front Leg
            ctx.beginPath();
            ctx.moveTo(3, hipY);
            const frontKneeX = Math.sin(stride) * 14;
            const frontKneeY = hipY + 21;
            const frontFootX = Math.sin(stride) * 22;
            const frontFootY = -3 - Math.max(0, Math.cos(walkCycle)) * 4 * (1 - slump * 0.5);
            ctx.lineTo(frontKneeX, frontKneeY);
            ctx.lineTo(frontFootX, frontFootY);
            ctx.stroke();

            // Torso (slumps forward when stressed, straightens when .ME. arrives)
            const torsoLean = slump * 0.36 - lookUp * 0.12;
            ctx.save();
            ctx.translate(0, hipY);
            ctx.rotate(torsoLean);

            // Back Arm (drooping low when heavy)
            ctx.strokeStyle = strokeMain;
            ctx.lineWidth = 7.5;
            ctx.beginPath();
            ctx.moveTo(0, -30);
            const armSwing = Math.sin(walkCycle) * 0.25 * (1 - slump);
            ctx.quadraticCurveTo(8 + slump * 8, -14, 5 + slump * 12 - armSwing * 14, -2 + slump * 6);
            ctx.stroke();

            // Rounded Stickman Party Capsule Torso
            ctx.fillStyle = bodyFill;
            ctx.strokeStyle = strokeMain;
            ctx.lineWidth = 4.5;
            ctx.beginPath();
            ctx.roundRect(-12, -38, 24, 40, 12);
            ctx.fill();
            ctx.stroke();

            // Head (tilts down with slump, tilts up toward .ME. in Act 3)
            const headTilt = slump * 0.42 - lookUp * 0.32;
            ctx.save();
            ctx.translate(slump * 4, -56 + slump * 4);
            ctx.rotate(headTilt);

            // Round cartoon head
            ctx.fillStyle = bodyFill;
            ctx.strokeStyle = strokeMain;
            ctx.lineWidth = 4.5;
            ctx.beginPath();
            ctx.arc(0, 0, 21, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            // Expressive Stickman Party Large Cartoon Eyes (facing right)
            const eyeOffsetX = 6;
            const eyeOffsetY = lookUp * -3 + slump * 2;

            // Left Eye
            ctx.fillStyle = '#FFFFFF';
            ctx.strokeStyle = strokeMain;
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            ctx.ellipse(eyeOffsetX - 4, eyeOffsetY - 2, 5.5, 7, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            // Right Eye
            ctx.beginPath();
            ctx.ellipse(eyeOffsetX + 6, eyeOffsetY - 2, 5.5, 7, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            // Pupils
            ctx.fillStyle = '#0F172A';
            const pupilShiftY = lookUp * -2 + slump * 2.5;
            ctx.beginPath();
            ctx.arc(eyeOffsetX - 2.5, eyeOffsetY - 1.5 + pupilShiftY, 2.4, 0, Math.PI * 2);
            ctx.arc(eyeOffsetX + 7.5, eyeOffsetY - 1.5 + pupilShiftY, 2.4, 0, Math.PI * 2);
            ctx.fill();

            // Expressive Eyebrows (worried tilt when slumped, lifted/hopeful when looking up)
            ctx.strokeStyle = strokeMain;
            ctx.lineWidth = 2.6;
            ctx.beginPath();
            if (slump > 0.35 && lookUp < 0.4) {
                // Sad / worried brows
                ctx.moveTo(eyeOffsetX - 9, eyeOffsetY - 11);
                ctx.lineTo(eyeOffsetX - 1, eyeOffsetY - 8.5);
                ctx.moveTo(eyeOffsetX + 3, eyeOffsetY - 8.5);
                ctx.lineTo(eyeOffsetX + 11, eyeOffsetY - 11);
            } else {
                // Hopeful / curious brows
                ctx.moveTo(eyeOffsetX - 9, eyeOffsetY - 11 - lookUp * 2);
                ctx.lineTo(eyeOffsetX - 1, eyeOffsetY - 12 - lookUp * 2);
                ctx.moveTo(eyeOffsetX + 3, eyeOffsetY - 12 - lookUp * 2);
                ctx.lineTo(eyeOffsetX + 11, eyeOffsetY - 11 - lookUp * 2);
            }
            ctx.stroke();

            // Mouth expression (frown -> soft smile)
            ctx.beginPath();
            if (smile > 0.4) {
                ctx.arc(eyeOffsetX + 2, eyeOffsetY + 8, 5, 0.15 * Math.PI, 0.85 * Math.PI);
            } else if (slump > 0.3) {
                ctx.arc(eyeOffsetX + 2, eyeOffsetY + 13, 4.5, 1.15 * Math.PI, 1.85 * Math.PI);
            } else {
                ctx.moveTo(eyeOffsetX - 2, eyeOffsetY + 10);
                ctx.lineTo(eyeOffsetX + 6, eyeOffsetY + 10);
            }
            ctx.stroke();

            ctx.restore(); // End head

            // Front Arm (hanging heavily during slump)
            ctx.strokeStyle = strokeMain;
            ctx.lineWidth = 7.5;
            ctx.beginPath();
            ctx.moveTo(-2, -28);
            ctx.quadraticCurveTo(-4 + slump * 10, -12, 2 + slump * 14 + armSwing * 14, 0 + slump * 6);
            ctx.stroke();

            ctx.restore(); // End torso
            ctx.restore(); // End character
        }

        function drawMeOrbAndSpeech(ctx, orbX, orbY, alpha, pulseTime, speechProgress) {
            if (alpha <= 0.01) return;
            ctx.save();
            ctx.globalAlpha = alpha;

            const pulse = Math.sin(pulseTime * 3.5) * 6;

            // Outer ambient golden halo
            const outerGrad = ctx.createRadialGradient(orbX, orbY, 10, orbX, orbY, 150 + pulse * 2);
            outerGrad.addColorStop(0, 'rgba(255, 251, 235, 0.95)');
            outerGrad.addColorStop(0.3, 'rgba(253, 224, 71, 0.45)');
            outerGrad.addColorStop(0.65, 'rgba(196, 181, 253, 0.18)');
            outerGrad.addColorStop(1, 'rgba(253, 224, 71, 0)');

            ctx.fillStyle = outerGrad;
            ctx.beginPath();
            ctx.arc(orbX, orbY, 150 + pulse * 2, 0, Math.PI * 2);
            ctx.fill();

            // Concentric gentle rings
            ctx.strokeStyle = 'rgba(254, 240, 138, 0.35)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(orbX, orbY, 54 + pulse, 0, Math.PI * 2);
            ctx.stroke();

            // Radiant Core Orb
            const coreGrad = ctx.createRadialGradient(orbX - 6, orbY - 6, 4, orbX, orbY, 36);
            coreGrad.addColorStop(0, '#FFFFFF');
            coreGrad.addColorStop(0.7, '#FEF08A');
            coreGrad.addColorStop(1, '#F59E0B');

            ctx.fillStyle = coreGrad;
            ctx.shadowColor = '#FDE047';
            ctx.shadowBlur = 28;
            ctx.beginPath();
            ctx.arc(orbX, orbY, 34 + pulse * 0.3, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;

            // ".ME." Glowing Typography inside/on the orb
            ctx.fillStyle = '#1E293B';
            ctx.font = '700 18px "Plus Jakarta Sans", sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('.ME.', orbX, orbY + 1);

            // Friendly Speech Bubble in Act 3
            if (speechProgress > 0.02) {
                ctx.save();
                const bubbleScale = Math.min(1, speechProgress * 1.25);
                const bubbleW = Math.min(310, window.innerWidth * 0.78);
                const bubbleH = 68;
                const bx = orbX - bubbleW * 0.55;
                const by = orbY - 115;

                ctx.globalAlpha = alpha * Math.min(1, speechProgress * 1.5);
                ctx.translate(orbX, orbY - 48);
                ctx.scale(bubbleScale, bubbleScale);
                ctx.translate(-orbX, -(orbY - 48));

                // Bubble shadow & pill
                ctx.fillStyle = '#FFFFFF';
                ctx.shadowColor = 'rgba(0, 0, 0, 0.25)';
                ctx.shadowBlur = 20;
                ctx.beginPath();
                ctx.roundRect(bx, by, bubbleW, bubbleH, 20);
                ctx.fill();
                ctx.shadowBlur = 0;

                // Bubble pointer tail toward .ME.
                ctx.beginPath();
                ctx.moveTo(orbX - 10, by + bubbleH - 1);
                ctx.lineTo(orbX, by + bubbleH + 13);
                ctx.lineTo(orbX + 10, by + bubbleH - 1);
                ctx.closePath();
                ctx.fill();

                // Speech text
                ctx.fillStyle = '#0F172A';
                ctx.font = '600 15px "Fraunces", serif';
                ctx.textAlign = 'center';
                ctx.fillText("I'm .ME. — and I'm here to help.", bx + bubbleW / 2, by + 27);

                ctx.fillStyle = '#537365';
                ctx.font = '600 11.5px "Plus Jakarta Sans", sans-serif';
                ctx.fillText("You don't have to carry it alone.", bx + bubbleW / 2, by + 48);

                ctx.restore();
            }

            ctx.restore();
        }

        function renderIntroFrame(timestamp) {
            if (!introActive || !introCtx) return;
            if (!introStartTime) introStartTime = timestamp;

            const elapsed = (timestamp - introStartTime) / 1000;
            const w = window.innerWidth;
            const h = window.innerHeight;
            const groundY = h * 0.72;

            // Update progress bar
            const progressPct = Math.min(100, (elapsed / INTRO_DURATION) * 100);
            const bar = document.getElementById('intro-progress-bar');
            if (bar) bar.style.width = `${progressPct}%`;

            // Narrative Act Progress Calculations
            // Act 1 (0 -> 4.5s): Heavy walk & darkening world
            const act1T = Math.min(1, elapsed / 4.5);
            // Act 2 (4.5 -> 8.2s): .ME. light arrives in darkness
            const act2T = Math.max(0, Math.min(1, (elapsed - 4.5) / 3.5));
            // Act 3 (8.0 -> 11.2s): Speech bubble & hope
            const act3T = Math.max(0, Math.min(1, (elapsed - 8.0) / 2.2));
            // Finale Bloom (10.6 -> 12.2s): Warm golden-cream expansion into webpage
            const bloomT = Math.max(0, Math.min(1, (elapsed - 10.6) / 1.5));

            // Audio Cues (if user enabled sound)
            if (elapsed >= 4.6 && !introCuePlayed.act2) {
                introCuePlayed.act2 = true;
                playChime('E5');
            }
            if (elapsed >= 8.1 && !introCuePlayed.act3) {
                introCuePlayed.act3 = true;
                playChime('G5');
            }
            if (elapsed >= 10.7 && !introCuePlayed.bloom) {
                introCuePlayed.bloom = true;
                playChime('C6');
            }

            // Update bottom subtitle caption smoothly
            const captionPill = document.getElementById('intro-caption-pill');
            if (captionPill) {
                if (elapsed < 4.5) {
                    captionPill.textContent = "Sometimes, carrying everything alone makes the world feel heavy and dark...";
                } else if (elapsed < 8.0) {
                    captionPill.textContent = "Even in the quietest, darkest moments, a gentle light can find you.";
                } else {
                    captionPill.textContent = "Meet .ME. — your pocket space to pause, breathe, and feel supported.";
                }
            }

            // 1. SKY / ENVIRONMENT BACKGROUND (Warm Pastel -> Lonely Midnight Charcoal -> Warm Dawn)
            const pastelTop = [250, 248, 245];
            const pastelBot = [225, 236, 228];
            const darkTop = [15, 20, 34];
            const darkBot = [28, 35, 54];
            const warmReturnTop = [254, 249, 235];
            const warmReturnBot = [250, 248, 245];

            let topCol = lerpColor(pastelTop, darkTop, Math.min(1, act1T * 1.25));
            let botCol = lerpColor(pastelBot, darkBot, Math.min(1, act1T * 1.25));

            if (act3T > 0) {
                // Soften darkness slightly as .ME. speaks
                topCol = lerpColor([15, 20, 34], [38, 45, 72], act3T * 0.6);
                botCol = lerpColor([28, 35, 54], [65, 68, 96], act3T * 0.6);
            }

            const bgGrad = introCtx.createLinearGradient(0, 0, 0, h);
            bgGrad.addColorStop(0, topCol);
            bgGrad.addColorStop(1, botCol);
            introCtx.fillStyle = bgGrad;
            introCtx.fillRect(0, 0, w, h);

            // Subtle drifting loneliness particles in the dark
            const particleAlpha = Math.max(0, Math.min(0.55, act1T * 0.7 - act3T * 0.35));
            if (particleAlpha > 0.01) {
                introCtx.fillStyle = `rgba(148, 163, 184, ${particleAlpha})`;
                lonelinessParticles.forEach((p, idx) => {
                    const px = ((p.x / 100) * w + Math.sin(elapsed + idx) * 18 + w) % w;
                    const py = ((p.y / 100) * groundY - elapsed * p.speedY * 25 + groundY) % groundY;
                    introCtx.beginPath();
                    introCtx.arc(px, py, p.r, 0, Math.PI * 2);
                    introCtx.fill();
                });
            }

            // Ground Plane
            const groundCol = lerpColor([210, 224, 214], [20, 26, 42], Math.min(1, act1T * 1.25));
            introCtx.fillStyle = groundCol;
            introCtx.fillRect(0, groundY, w, h - groundY);

            // Subtle horizon line
            introCtx.strokeStyle = `rgba(255, 255, 255, ${0.12 * act1T})`;
            introCtx.lineWidth = 1.5;
            introCtx.beginPath();
            introCtx.moveTo(0, groundY);
            introCtx.lineTo(w, groundY);
            introCtx.stroke();

            // 2. STICKMAN POSITION & POSTURE
            const startX = w * 0.22;
            const stopX = Math.min(w * 0.44, w / 2 - 45);
            const walkProgress = Math.min(1, elapsed / 6.2);
            // Smooth ease-out walk that slows down as he grows tired
            const easedWalk = 1 - Math.pow(1 - walkProgress, 1.85);
            const charX = lerp(startX, stopX, easedWalk);

            // Walk cycle stops gently once .ME. arrives and he looks up
            const isWalking = elapsed < 6.4;
            const walkSpeed = lerp(5.2, 2.2, act1T);
            const walkCycle = isWalking ? elapsed * walkSpeed : 0;

            // Slump builds in Act 1, then lifts in Act 3
            const slumpAmount = Math.max(0, Math.min(1, act1T * 1.15) - act3T * 0.85);
            const lookUpAmount = act3T;
            const smileAmount = Math.max(0, (act3T - 0.35) / 0.65);

            const charScale = w < 480 ? 0.92 : 1.15;

            // Draw Stickman
            drawStickmanPartyCharacter(introCtx, charX, groundY, {
                slump: slumpAmount,
                walkCycle,
                lookUp: lookUpAmount,
                smile: smileAmount,
                scale: charScale
            });

            // Floating stress scribble cloud above stickman (fades out when .ME. speaks)
            const cloudAlpha = Math.max(0, Math.min(0.9, (act1T - 0.25) * 1.4) - act3T * 1.3);
            drawScribbleCloud(introCtx, charX + slumpAmount * 12, groundY - 128 * charScale, cloudAlpha, elapsed);

            // 3. ".ME." BRIGHT LIGHT ARRIVAL (Act 2 & Act 3)
            if (act2T > 0) {
                const orbTargetX = Math.min(w * 0.68, charX + (w < 480 ? 115 : 175));
                const orbStartY = groundY - 230;
                const orbTargetY = groundY - 115 * charScale;
                const easedOrb = 1 - Math.pow(1 - act2T, 3);
                const orbY = lerp(orbStartY, orbTargetY, easedOrb) + Math.sin(elapsed * 2.5) * 6;

                // Soft beam of light connecting .ME. toward the stickman
                if (act2T > 0.35) {
                    const beamAlpha = Math.min(0.22, (act2T - 0.35) * 0.35);
                    const beamGrad = introCtx.createLinearGradient(orbTargetX, orbY, charX, groundY - 40);
                    beamGrad.addColorStop(0, `rgba(254, 240, 138, ${beamAlpha})`);
                    beamGrad.addColorStop(1, 'rgba(254, 240, 138, 0)');
                    introCtx.fillStyle = beamGrad;
                    introCtx.beginPath();
                    introCtx.moveTo(orbTargetX, orbY - 25);
                    introCtx.lineTo(charX - 30, groundY);
                    introCtx.lineTo(charX + 45, groundY);
                    introCtx.lineTo(orbTargetX, orbY + 25);
                    introCtx.closePath();
                    introCtx.fill();
                }

                drawMeOrbAndSpeech(introCtx, orbTargetX, orbY, Math.min(1, act2T * 1.8), elapsed, act3T);
            }

            // 4. WARM LIGHT EXPANSION TRANSITION INTO WEBPAGE
            if (bloomT > 0) {
                const orbX = Math.min(w * 0.68, charX + (w < 480 ? 115 : 175));
                const orbY = groundY - 115 * charScale;
                const maxRadius = Math.hypot(w, h);
                const radius = bloomT * bloomT * maxRadius * 1.15;

                const bloomGrad = introCtx.createRadialGradient(orbX, orbY, 0, orbX, orbY, Math.max(1, radius));
                bloomGrad.addColorStop(0, '#FAF8F5');
                bloomGrad.addColorStop(0.75, '#FEF9C3');
                bloomGrad.addColorStop(1, 'rgba(250, 248, 245, 0)');

                introCtx.fillStyle = bloomGrad;
                introCtx.beginPath();
                introCtx.arc(orbX, orbY, radius, 0, Math.PI * 2);
                introCtx.fill();
            }

            if (elapsed >= INTRO_DURATION) {
                finishIntro(false);
                return;
            }

            introAnimId = requestAnimationFrame(renderIntroFrame);
        }

        function finishIntro(skipped = false) {
            if (!introActive) return;
            introActive = false;
            if (introAnimId) cancelAnimationFrame(introAnimId);

            try {
                sessionStorage.setItem('me_intro_seen', 'true');
            } catch (e) {
                // Ignore storage errors in restricted contexts
            }

            if (skipped) playChime('G5');

            if (introOverlay) {
                introOverlay.classList.add('fade-out');
            }
            document.body.classList.remove('overflow-hidden');
        }

        function replayIntro() {
            introActive = true;
            introStartTime = null;
            introCuePlayed = { act2: false, act3: false, bloom: false };
            resizeIntroCanvas();

            if (introOverlay) {
                introOverlay.classList.remove('fade-out');
            }
            document.body.classList.add('overflow-hidden');
            window.scrollTo({ top: 0, behavior: 'instant' });

            if (introAnimId) cancelAnimationFrame(introAnimId);
            introAnimId = requestAnimationFrame(renderIntroFrame);
        }

        // Play the .ME. intro automatically on first visit in this browser session
        window.addEventListener('DOMContentLoaded', () => {
            let alreadySeen = false;
            try {
                alreadySeen = sessionStorage.getItem('me_intro_seen') === 'true';
            } catch (e) {
                alreadySeen = false;
            }

            if (alreadySeen) {
                introActive = false;
                if (introOverlay) {
                    introOverlay.classList.add('fade-out');
                }
                document.body.classList.remove('overflow-hidden');
            } else {
                document.body.classList.add('overflow-hidden');
                resizeIntroCanvas();
                introAnimId = requestAnimationFrame(renderIntroFrame);
            }
        });
    </script>
</body>
</html>
